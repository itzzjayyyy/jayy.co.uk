<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23050810'/%3E%3Crect x='2' y='2' width='28' height='28' rx='3' fill='none' stroke='%2300d2ff' stroke-width='1' opacity='0.4'/%3E%3Crect x='5' y='5' width='10' height='10' fill='%2300d2ff' opacity='0.9'/%3E%3Crect x='17' y='17' width='10' height='10' fill='%237b2fff' opacity='0.85'/%3E%3Crect x='17' y='5' width='10' height='10' fill='none' stroke='%2300d2ff' stroke-width='1' opacity='0.35'/%3E%3Crect x='5' y='17' width='10' height='10' fill='none' stroke='%237b2fff' stroke-width='1' opacity='0.35'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --surface: #0a0f1e;
    --border: rgba(0,210,255,0.12);
    --accent: #00d2ff;
    --accent2: #7b2fff;
    --accent3: #ff3e7f;
    --text: #e8eaf6;
    --muted: #5a6a8a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-weight: 300;
    overflow: hidden;
    height: 100vh;
    cursor: none;
  }

  #cursor {
    position: fixed; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent);
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    transition: transform 0.1s, background 0.2s;
    mix-blend-mode: screen;
  }
  #cursor-ring {
    position: fixed; width: 36px; height: 36px;
    border-radius: 50%; border: 1px solid var(--accent);
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: transform 0.18s ease, width 0.2s, height 0.2s, opacity 0.2s;
    opacity: 0.5;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,210,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,210,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; opacity: 0.4;
  }

  /* no scan line — one less thing */

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.5rem 4rem;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(5,8,16,0.9), transparent);
    backdrop-filter: blur(4px);
  }
  .nav-logo { display: flex; align-items: center; text-decoration: none; }

  /* single subtle orb */
  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(100px); opacity: 0.10;
    pointer-events: none; z-index: 0;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .orb1 { width: 500px; height: 500px; background: var(--accent2); bottom: -150px; right: -100px; animation-delay: 0s; }

  @keyframes orbFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.04); }
  }

  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 0 8rem;
  }

  .error-label {
    font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1rem;
    opacity: 0; animation: fadeUp 0.8s 0.3s forwards;
  }
  .error-label::before {
    content: ''; display: block; width: 40px; height: 1px; background: var(--accent);
  }

  .error-code {
    font-family: 'Orbitron', monospace;
    font-size: clamp(5rem, 12vw, 9rem);
    font-weight: 900; line-height: 0.9;
    letter-spacing: -0.03em; margin-bottom: 1rem;
    color: var(--text);
    opacity: 0; animation: fadeUp 0.8s 0.5s forwards;
  }

  .error-sub-heading {
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.9rem, 2vw, 1.3rem);
    font-weight: 700; color: var(--muted);
    letter-spacing: 0.08em; margin-bottom: 1.5rem;
    opacity: 0; animation: fadeUp 0.8s 0.55s forwards;
  }

  .error-desc {
    font-size: 1rem; line-height: 1.8;
    color: var(--muted); max-width: 460px; margin-bottom: 2rem;
    opacity: 0; animation: fadeUp 0.8s 0.65s forwards;
  }

  .terminal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid rgba(0,210,255,0.3);
    padding: 1.2rem 1.6rem;
    margin-bottom: 3rem; max-width: 460px;
    font-family: 'Orbitron', monospace;
    font-size: 0.68rem; letter-spacing: 0.08em; line-height: 2;
    opacity: 0; animation: fadeUp 0.8s 0.75s forwards;
  }
  .terminal-line { color: var(--muted); }
  .terminal-line .prompt { color: var(--accent2); margin-right: 0.6rem; }
  .terminal-line .err { color: var(--accent3); }
  .terminal-line .ok { color: #00ff88; }

  .blink {
    display: inline-block; width: 5px; height: 0.75em;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom; margin-left: 2px;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .error-cta {
    display: flex; gap: 1.5rem;
    opacity: 0; animation: fadeUp 0.8s 0.85s forwards;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 2rem;
    font-family: 'Syne', sans-serif; font-size: 0.8rem;
    font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    text-decoration: none; border: none; cursor: pointer;
    transition: all 0.3s;
  }
  .btn-primary {
    background: var(--accent); color: var(--bg);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .btn-primary:hover {
    background: #fff;
    box-shadow: 0 0 40px rgba(0,210,255,0.4);
    transform: translateY(-2px);
  }
  .btn-ghost {
    background: transparent; color: var(--accent);
    border: 1px solid rgba(0,210,255,0.3);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    background: rgba(0,210,255,0.07);
    transform: translateY(-2px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1;
    padding: 2rem 8rem;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(5,8,16,0.6); backdrop-filter: blur(10px);
  }
  .footer-copy { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; }

  @media (max-width: 1100px) {
    nav, .page, footer { padding-left: 4rem; padding-right: 4rem; }
  }

  @media (max-width: 700px) {
    body { cursor: auto; overflow: auto; height: auto; }
    #cursor, #cursor-ring { display: none; }
    nav { padding: 1.1rem 1.4rem; }
    .page { padding: 6rem 1.4rem 8rem; min-height: 100svh; }
    .error-desc { max-width: 100%; }
    .error-cta { flex-direction: column; width: 100%; }
    .btn { justify-content: center; width: 100%; padding: 1rem 1.5rem; font-size: 0.75rem; }
    footer { padding: 1.5rem 1.4rem; }
  }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<div class="orb orb1"></div>

<nav>
  <a href="/" class="nav-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="1" y="1" width="26" height="26" rx="2" stroke="#00d2ff" stroke-width="1" opacity="0.4"/>
      <rect x="5" y="5" width="8" height="8" fill="#00d2ff" opacity="0.9"/>
      <rect x="15" y="5" width="8" height="8" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.5"/>
      <rect x="5" y="15" width="8" height="8" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.5"/>
      <rect x="15" y="15" width="8" height="8" fill="#7b2fff" opacity="0.7"/>
    </svg>
  </a>
</nav>

<div class="page">
  <div class="error-label">Error — Route Not Found</div>

  <div class="error-code">404</div>
  <div class="error-sub-heading">Page does not exist</div>

  <p class="error-desc">
    Whatever you were looking for isn't here — the link is broken, the page moved, or it never existed. Nothing on your end.
  </p>

  <div class="terminal">
    <div class="terminal-line"><span class="prompt">&gt;</span>GET <span class="err" id="req-path">/???</span></div>
    <div class="terminal-line"><span class="prompt">&gt;</span>Status: <span class="err">404 NOT_FOUND</span></div>
    <div class="terminal-line"><span class="prompt">&gt;</span>Suggestion: <span class="ok">return to /</span><span class="blink"></span></div>
  </div>

  <div class="error-cta">
    <a href="/" class="btn btn-primary">Back to Home</a>
    <a href="mailto:jayy@jzrr.uk" class="btn btn-ghost">Get In Touch</a>
  </div>
</div>

<footer>
  <div class="footer-copy">&copy; 2025</div>
</footer>

<script>
  const el = document.getElementById('req-path');
  if (el) el.textContent = window.location.pathname;

  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursor-ring');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
  });
  (function animRing() {
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(animRing);
  })();
  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursor.style.transform = 'translate(-50%,-50%) scale(2.5)';
      ring.style.width = '60px'; ring.style.height = '60px'; ring.style.opacity = '0.2';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.transform = 'translate(-50%,-50%) scale(1)';
      ring.style.width = '36px'; ring.style.height = '36px'; ring.style.opacity = '0.5';
    });
  });
</script>
</body>
</html>
