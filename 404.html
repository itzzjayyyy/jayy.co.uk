<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --surface: #0a0f1e;
    --border: rgba(0,210,255,0.12);
    --accent: #00d2ff;
    --accent2: #7b2fff;
    --accent3: #ff3e7f;
    --text: #e8eaf6;
    --muted: #5a6a8a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-weight: 300;
    overflow: hidden;
    height: 100vh;
    cursor: none;
  }

  #cursor {
    position: fixed; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent);
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    transition: transform 0.1s, background 0.2s;
    mix-blend-mode: screen;
  }
  #cursor-ring {
    position: fixed; width: 36px; height: 36px;
    border-radius: 50%; border: 1px solid var(--accent);
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: transform 0.18s ease, width 0.2s, height 0.2s, opacity 0.2s;
    opacity: 0.5;
  }

  /* Grid overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,210,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,210,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* Noise overlay */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; opacity: 0.4;
  }

  /* Scan line */
  .scan-line {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.15; z-index: 200;
    animation: scanDown 6s linear infinite;
  }
  @keyframes scanDown { 0% { top: 0; } 100% { top: 100vh; } }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.5rem 4rem;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(5,8,16,0.9), transparent);
    backdrop-filter: blur(4px);
  }
  .nav-logo { display: flex; align-items: center; text-decoration: none; }

  /* Orbs */
  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.14;
    pointer-events: none;
    animation: orbFloat 10s ease-in-out infinite;
    z-index: 0;
  }
  .orb1 { width: 500px; height: 500px; background: var(--accent3); top: -150px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 350px; height: 350px; background: var(--accent2); bottom: -80px; right: -60px; animation-delay: -5s; }
  .orb3 { width: 200px; height: 200px; background: var(--accent); top: 50%; right: 15%; animation-delay: -3s; }

  @keyframes orbFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  /* Main layout */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 0 8rem;
  }

  /* Giant 404 background text */
  .four-oh-four-bg {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Orbitron', monospace;
    font-size: clamp(18rem, 35vw, 38rem);
    font-weight: 900;
    letter-spacing: -0.05em;
    color: transparent;
    -webkit-text-stroke: 1px rgba(0,210,255,0.06);
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
    user-select: none;
    animation: bgPulse 4s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%, 100% { -webkit-text-stroke-color: rgba(0,210,255,0.06); }
    50% { -webkit-text-stroke-color: rgba(0,210,255,0.12); }
  }

  /* Error label */
  .error-label {
    font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--accent3); margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1rem;
    opacity: 0; animation: fadeUp 0.7s 0.2s forwards;
  }
  .error-label::before {
    content: ''; display: block;
    width: 40px; height: 1px; background: var(--accent3);
  }

  /* The 404 heading */
  .error-code {
    font-family: 'Orbitron', monospace;
    font-size: clamp(5rem, 14vw, 11rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
    opacity: 0; animation: fadeUp 0.7s 0.35s forwards;
    position: relative;
  }
  .error-code .four-left { color: var(--text); }
  .error-code .zero {
    -webkit-text-stroke: 1px var(--accent);
    color: transparent;
    display: inline-block;
    animation: glitchZero 5s 2s infinite;
  }
  .error-code .four-right { color: var(--text); }

  @keyframes glitchZero {
    0%, 90%, 100% {
      text-shadow: none;
      transform: translateX(0);
      -webkit-text-stroke-color: var(--accent);
    }
    91% { text-shadow: 3px 0 var(--accent3); transform: translateX(-3px); -webkit-text-stroke-color: var(--accent3); }
    92% { text-shadow: -3px 0 var(--accent2); transform: translateX(3px); -webkit-text-stroke-color: var(--accent2); }
    93% { text-shadow: 3px 0 var(--accent3); transform: translateX(-1px); -webkit-text-stroke-color: var(--accent); }
    94% { text-shadow: none; transform: translateX(0); }
  }

  /* Subtitle */
  .error-sub-heading {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 1.5rem;
    opacity: 0; animation: fadeUp 0.7s 0.5s forwards;
  }

  /* Description */
  .error-desc {
    font-size: 1rem;
    line-height: 1.8;
    color: var(--muted);
    max-width: 460px;
    margin-bottom: 3rem;
    opacity: 0; animation: fadeUp 0.7s 0.65s forwards;
  }

  /* Terminal block */
  .terminal {
    background: rgba(10,15,30,0.8);
    border: 1px solid var(--border);
    padding: 1.2rem 1.6rem;
    margin-bottom: 3rem;
    max-width: 460px;
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    line-height: 1.9;
    opacity: 0; animation: fadeUp 0.7s 0.8s forwards;
    position: relative;
  }
  .terminal::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent3), var(--accent2));
  }
  .terminal-line { color: var(--muted); }
  .terminal-line .prompt { color: var(--accent2); margin-right: 0.6rem; }
  .terminal-line .cmd { color: var(--accent); }
  .terminal-line .err { color: var(--accent3); }
  .terminal-line .ok { color: #00ff88; }

  .blink {
    display: inline-block; width: 6px; height: 0.75em;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom; margin-left: 2px;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* Buttons */
  .error-cta {
    display: flex; gap: 1.5rem;
    opacity: 0; animation: fadeUp 0.7s 0.95s forwards;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 2rem;
    font-family: 'Syne', sans-serif; font-size: 0.8rem;
    font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    text-decoration: none; border: none; cursor: none;
    transition: all 0.3s;
  }
  .btn-primary {
    background: var(--accent); color: var(--bg);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .btn-primary:hover {
    background: #fff;
    box-shadow: 0 0 40px rgba(0,210,255,0.5);
    transform: translateY(-2px);
  }
  .btn-ghost {
    background: transparent; color: var(--accent);
    border: 1px solid rgba(0,210,255,0.3);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    background: rgba(0,210,255,0.07);
    transform: translateY(-2px);
  }

  /* Decorative signal lines */
  .signal-lines {
    position: fixed; right: 8rem; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; animation: fadeIn 0.8s 1.2s forwards;
    z-index: 1;
  }
  .signal-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
    animation: signalPulse 2.4s ease-in-out infinite;
  }
  .signal-line:nth-child(1) { width: 60px; animation-delay: 0s; }
  .signal-line:nth-child(2) { width: 40px; animation-delay: 0.3s; }
  .signal-line:nth-child(3) { width: 80px; animation-delay: 0.6s; }
  .signal-line:nth-child(4) { width: 30px; animation-delay: 0.9s; }
  .signal-line:nth-child(5) { width: 55px; animation-delay: 1.2s; }
  .signal-line:nth-child(6) { width: 20px; animation-delay: 1.5s; }
  .signal-line:nth-child(7) { width: 70px; animation-delay: 0.4s; }
  .signal-line:nth-child(8) { width: 45px; animation-delay: 0.8s; }

  @keyframes signalPulse {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.6; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Status indicator */
  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent3);
    margin-right: 0.5rem;
    animation: statusBlink 1.5s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes statusBlink {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--accent3); }
    50% { opacity: 0.3; box-shadow: none; }
  }

  /* Footer */
  footer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 1;
    padding: 1.5rem 8rem;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(5,8,16,0.6);
    backdrop-filter: blur(10px);
  }
  .footer-logo {
    font-family: 'Orbitron', monospace; font-size: 0.75rem;
    font-weight: 700; color: var(--muted); letter-spacing: 0.3em;
  }
  .footer-status {
    font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted);
  }

  /* Mobile */
  @media (max-width: 700px) {
    body { cursor: auto; overflow: auto; height: auto; }
    #cursor, #cursor-ring { display: none; }
    nav { padding: 1.1rem 1.4rem; }
    .page { padding: 6rem 1.4rem 8rem; min-height: 100svh; }
    .four-oh-four-bg { font-size: 45vw; }
    .error-code { font-size: clamp(4rem, 22vw, 7rem); }
    .signal-lines { display: none; }
    .terminal { max-width: 100%; }
    .error-desc { max-width: 100%; }
    .error-cta { flex-direction: column; width: 100%; }
    .btn { justify-content: center; width: 100%; }
    footer { padding: 1.2rem 1.4rem; }
  }
</style>
</head>
<body>

<div class="scan-line"></div>
<div id="cursor"></div>
<div id="cursor-ring"></div>

<div class="four-oh-four-bg">404</div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<nav>
  <a href="/" class="nav-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="1" y="1" width="26" height="26" rx="2" stroke="#00d2ff" stroke-width="1" opacity="0.4"/>
      <rect x="5" y="5" width="8" height="8" fill="#00d2ff" opacity="0.9"/>
      <rect x="15" y="5" width="8" height="8" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.5"/>
      <rect x="5" y="15" width="8" height="8" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.5"/>
      <rect x="15" y="15" width="8" height="8" fill="#7b2fff" opacity="0.7"/>
    </svg>
  </a>
</nav>

<div class="page">
  <div class="error-label">
    <span class="status-dot"></span>Error — Route Not Found
  </div>

  <div class="error-code">
    <span class="four-left">4</span><span class="zero">0</span><span class="four-right">4</span>
  </div>

  <div class="error-sub-heading">Page Does Not Exist</div>

  <p class="error-desc">
    Whatever you were looking for isn't here — either the link is broken, the page moved, or it never existed. Nothing to debug on your end.
  </p>

  <div class="terminal">
    <div class="terminal-line"><span class="prompt">&gt;</span><span class="cmd">GET</span> <span class="err" id="req-path"></span></div>
    <div class="terminal-line"><span class="prompt">&gt;</span>Status: <span class="err">404 NOT_FOUND</span></div>
    <div class="terminal-line"><span class="prompt">&gt;</span>Route: <span class="err">unresolved</span></div>
    <div class="terminal-line"><span class="prompt">&gt;</span>Suggestion: <span class="ok">return to /</span><span class="blink"></span></div>
  </div>

  <div class="error-cta">
    <a href="/" class="btn btn-primary">Back to Home</a>
    <a href="/#contact" class="btn btn-ghost">Get In Touch</a>
  </div>
</div>

<div class="signal-lines">
  <div class="signal-line"></div>
  <div class="signal-line"></div>
  <div class="signal-line"></div>
  <div class="signal-line"></div>
  <div class="signal-line"></div>
  <div class="signal-line"></div>
  <div class="signal-line"></div>
  <div class="signal-line"></div>
</div>

<footer>
  <div class="footer-logo">
    <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
      <rect x="1" y="1" width="26" height="26" rx="2" stroke="#5a6a8a" stroke-width="1" opacity="0.4"/>
      <rect x="5" y="5" width="8" height="8" fill="#5a6a8a" opacity="0.6"/>
      <rect x="15" y="15" width="8" height="8" fill="#5a6a8a" opacity="0.3"/>
    </svg>
  </div>
  <div class="footer-status">&copy; 2025</div>
</footer>

<script>
  document.getElementById('req-path').textContent = window.location.pathname;

  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursor-ring');
  let mx = 0, my = 0, rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px';
    cursor.style.top = my + 'px';
  });

  (function animRing() {
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    requestAnimationFrame(animRing);
  })();

  document.querySelectorAll('a, button').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursor.style.transform = 'translate(-50%,-50%) scale(2.5)';
      ring.style.width = '60px'; ring.style.height = '60px'; ring.style.opacity = '0.2';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.transform = 'translate(-50%,-50%) scale(1)';
      ring.style.width = '36px'; ring.style.height = '36px'; ring.style.opacity = '0.5';
    });
  });
</script>
</body>
</html>
